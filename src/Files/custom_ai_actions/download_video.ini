# Кастомное действие: скачать видео с YouTube и, если попросили, обработать его.
# Имя файла — ключ процессора (AiActionsProcessors/DownloadVideo.cs).
# Гейт уже проверил, что в сообщении есть ссылка на видео и текст помимо неё.

[ACTION]
Скачать видео с YouTube

[GATE]
HAS_YOUTUBE_LINK

[HIT_PROMPT]
Твоя задача понять, просит ли пользователь скачать видео по ссылке или что-то
с ним сделать: обрезать по времени, сменить формат, вытащить звуковую дорожку,
сделать гифку.
Отвечай строго ДА или НЕТ.
Является ли следующее сообщение такой просьбой?
"""
{{message}}
"""

Примеры, на которые надо ответить ДА:
Скачай это
Скинь файлом
Обрежь с 1:04 по 1:40
Вырежи звуковую дорожку
Сделай гифку из первых пяти секунд
Достань отсюда музыку

Примеры, на которые надо ответить НЕТ:
Смотрел вот это?
Что думаешь про этот клип?
Найди мне что-нибудь похожее
О чём тут говорят?
Сделай гифку из вот этого файла
