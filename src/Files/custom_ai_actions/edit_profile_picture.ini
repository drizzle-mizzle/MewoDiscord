# Кастомное действие: правка аватарки пользователя.
# Имя файла — ключ процессора (AiActionsProcessors/EditProfilePicture.cs).
# Строки, начинающиеся с #, — комментарии, в том числе внутри секций.

[ACTION]
Отредактировать аватарку пользователя

[GATE]
HAS_USER_MENTION

[HIT_PROMPT]
Твоя задача понять, была ли вызвана команда изменить изображение на аватарке пользователя.
Отвечай строго ДА или НЕТ.
Является ли следующее сообщение запросом отредактировать изображение?
"""
{{message}}
"""

Пример запроса, на который надо ответить ДА:
Добавь @user на аватарку ушки
