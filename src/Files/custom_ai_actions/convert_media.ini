# Кастомное действие: что-то сделать с приложенным видео, гифкой или картинкой.
# Имя файла — ключ процессора (AiActionsProcessors/ConvertMedia.cs).
#
# Здесь решается только «просьба про файл или нет». Механическая она или творческая,
# решает уже промпт плана в процессоре: пустой план означает «работа для ИИ»,
# и просьба уходит в сессию ChatGPT с той же картинкой.
#
# Промпт намеренно широкий. Ошибки несимметричны: лишнее ДА стоит одного дешёвого
# запроса и попадает в ИИ, а лишнее НЕТ уводит сообщение в поиск активной сессии
# канала — и если её нет, бот не отвечает вообще.

[ACTION]
Сделать что-нибудь с приложенным файлом

[GATE]
HAS_MEDIA_ATTACHED

[HIT_PROMPT]
Твоя задача понять, просит ли пользователь что-то СДЕЛАТЬ с приложенным файлом —
изменить его и получить новый файл.
Считается и техническая обработка, и творческая переделка.

Техническая обработка — ровно эти операции и ничего сверх них:
сменить формат (gif, mp4, webm, png, jpg, webp), вытащить звуковую дорожку
(mp3, m4a, opus, ogg), обрезать по времени, вырезать область кадра,
изменить размер, изменить частоту кадров, взять один кадр.
Обрезка по времени, частота кадров и звук применимы только к видео, гифке и звуку;
формат, область кадра и размер — к чему угодно, включая картинки.

Творческая переделка — всё, что меняет содержимое кадра: дорисовать, убрать
или заменить предмет, отделить объект от фона, перекрасить, придумать новый вариант.

Отвечай строго ДА или НЕТ.
Является ли следующее сообщение просьбой сделать что-то из этих двух видов?
"""
{{message}}
"""

Примеры, на которые надо ответить ДА:
Сделай из этого гифку
Сконвертируй в png
Обрежь первые три секунды
Оставь только левую половину кадра
Уменьши до 320 пикселей
Вырежи звуковую дорожку
Вырежи персонажа с фона
Убери фон
Дорисуй ему шляпу
Сделай фон синим
Сделай кроссовер этого фото с другой вселенной, на твой вкус

Примеры, на которые надо ответить НЕТ:
Что тут происходит?
Опиши это видео словами
Кто это на картинке?
Как думаешь, красиво получилось?
Откуда этот кадр?
Скачай https://youtu.be/dQw4w9WgXcQ и сделай гифку
