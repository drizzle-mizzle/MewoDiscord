# Кастомное действие: механические операции над видео, гифками и картинками.
# Имя файла — ключ процессора (AiActionsProcessors/ConvertMedia.cs).
# Никакой генерации: обрезка, кроп, размер, формат — всё это делает ffmpeg.

[ACTION]
Обработать видео, гифку или картинку

[GATE]
HAS_MEDIA_ATTACHED

[HIT_PROMPT]
Твоя задача понять, просит ли пользователь выполнить техническую операцию над
видеофайлом, гифкой или картинкой: обрезать по времени, кадрировать, уменьшить, сменить формат,
изменить частоту кадров, вытащить кадр.
Отвечай строго ДА или НЕТ.
Является ли следующее сообщение такой просьбой?
"""
{{message}}
"""

Примеры, на которые надо ответить ДА:
Сделай из этого гифку
Сконвертируй в png
Обрежь первые три секунды
Оставь только левую половину кадра
Уменьши до 320 пикселей

Примеры, на которые надо ответить НЕТ:
Что тут происходит?
Дорисуй ему шляпу
Опиши это видео словами
Скачай https://youtu.be/dQw4w9WgXcQ и сделай гифку
