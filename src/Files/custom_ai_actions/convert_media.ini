# Кастомное действие: что-то сделать с приложенным видео, гифкой или картинкой.
# Имя файла — ключ процессора (AiActionsProcessors/ConvertMedia.cs).
#
# Промпт намеренно широкий, а не узкий. Процессор сам разбирается, механическая
# просьба или нет: он спрашивает у модели план операции, и пустой план означает
# «это работа для ИИ» — тогда просьба уходит в сессию ChatGPT с той же картинкой.
# Поэтому лишнее ДА стоит одного дешёвого запроса и ничего не ломает,
# а лишнее НЕТ отправляет просьбу в обычный чат, где ffmpeg недоступен
# и модель начнёт выдумывать, что она якобы обрезала.

[ACTION]
Сделать что-нибудь с приложенным файлом

[GATE]
HAS_MEDIA_ATTACHED

[HIT_PROMPT]
Твоя задача понять, просит ли пользователь что-то СДЕЛАТЬ с приложенным файлом —
изменить его и получить новый файл. Неважно, техническая это операция
(обрезать, кадрировать, уменьшить, сменить формат, вытащить звук или кадр)
или творческая (дорисовать, убрать лишнее, перекрасить).
Отвечай строго ДА или НЕТ.
Является ли следующее сообщение такой просьбой?
"""
{{message}}
"""

Примеры, на которые надо ответить ДА:
Сделай из этого гифку
Сконвертируй в png
Обрежь первые три секунды
Оставь только левую половину кадра
Уменьши до 320 пикселей
Вырежи звуковую дорожку
Вырежи персонажа с фона
Убери фон
Дорисуй ему шляпу
Сделай фон синим

Примеры, на которые надо ответить НЕТ:
Что тут происходит?
Опиши это видео словами
Кто это на картинке?
Как думаешь, красиво получилось?
Скачай https://youtu.be/dQw4w9WgXcQ и сделай гифку
