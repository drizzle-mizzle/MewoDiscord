# Голосовые каналы — подключение
VoiceConversationStarted: 📳 Начался разговор в {channel}
VoiceConversationEnded: 📴 Закончился разговор в {channel} | Длительность: **{timer}**
VoiceUserJoined: {user} присоединился к {channel} | Длительность: **{timer}**
VoiceUserLeft: {user} покинул {channel} | Длительность: **{timer}**

# Голосовые каналы — микрофон (self)
VoiceUserMuted: 🔇 {user} отключил себе микрофон в {channel} | Длительность: **{timer}**
VoiceUserUnmuted: 🔊 {user} включил себе микрофон в {channel} | Длительность: **{timer}**

# Голосовые каналы — микрофон (сервер)
VoiceUserServerMuted: 🔇 {user} был заглушен в {channel} | Длительность: **{timer}**
VoiceUserServerUnmuted: 🔊 {user} был разглушен в {channel} | Длительность: **{timer}**

# Голосовые каналы — звук (self)
VoiceUserDeafened: 🔇 {user} отключил себе звук в {channel} | Длительность: **{timer}**
VoiceUserUndeafened: 🔊 {user} включил себе звук в {channel} | Длительность: **{timer}**

# Голосовые каналы — звук (сервер)
VoiceUserServerDeafened: 🔇 {user} был полностью заглушен в {channel} | Длительность: **{timer}**
VoiceUserServerUndeafened: 🔊 {user} был полностью разглушен в {channel} | Длительность: **{timer}**

# Голосовые каналы — стрим
VoiceUserStartedStream: 📺 {user} начал стрим в {channel} | Длительность: **{timer}**
VoiceUserStoppedStream: 📺 {user} завершил стрим в {channel} | Длительность: **{timer}**

# Голосовые каналы — переименование «одинокого» канала
VoiceChannelRenamed: ✏️ Название канала изменено: **"{oldName}"** ➡️ **"{newName}"**

# Команда /reinstall
ReinstallDone: 🔄 Команды переустановлены на этом сервере. Удалено: глобальных **{global}**, серверных **{guild}**. Зарегистрировано: **{registered}**

# Команда /say
SayDone: ✅ Сообщение отправлено

# Команда /purge
PurgeDone: 🗑️ Удалено сообщений: **{count}**
PurgeTooOld: ⚠️ Пропущено сообщений старше 14 дней: **{count}**
PurgeNoPermission: ❌ У тебя нет прав на управление сообщениями
PurgeNotTextChannel: ❌ Эта команда работает только в текстовых каналах
PurgeBadDateFormat: ❌ Неверный формат даты. Используй: yyyy-MM-dd HH:mm (например, 2026-03-21 18:00)

# Команда /set
SetTemperature: 🌡️ Температура ИИ установлена на **{value}**

# Медиа из Telegram
TelegramFooter: Telegram
TelegramTooBig: 📦 Файл на {size} не влезает в лимит Discord — [открыть в Telegram]({url})

# Команда /chatgpt
# Многострочные значения: строка без Ключ: продолжает предыдущее сообщение
ChatGptLoginInstructions: 🔐 **Логин в ChatGPT**
  1️⃣ [Открой страницу входа]({url}) и войди в аккаунт с подпиской ChatGPT Plus
  2️⃣ После входа браузер попадёт на `localhost:1455` — страница не откроется, это нормально
  3️⃣ Скопируй ссылку из адресной строки целиком и нажми кнопку ниже
ChatGptLoginStartFailed: ❌ Не удалось начать логин — прокси недоступен или не задан ChatGptManagementKey (детали в логах)
ChatGptLoginDone: ✅ Логин выполнен — ChatGPT подключён
ChatGptLoginFailed: ❌ Логин не удался: {error}
ChatGptStatusEmpty: Подключённых аккаунтов ChatGPT нет — используй /chatgpt login
ChatGptStatusHeader: 🔐 **Аккаунты ChatGPT** ({count})
ChatGptStatusUnavailable: ⚠️ недоступен

# Сессии ChatGPT
ChatGptSessionNew: 💬 **Новая сессия ChatGPT**
  Чтобы отправить ваш запрос, ответьте на данное сообщение
ChatGptSessionsEmpty: Сессий пока нет — создайте командой /chatgpt new
ChatGptSessionsTitle: Сессии ChatGPT
ChatGptSessionsLine: {index}. Канал: {channel} | Всего сообщений: **{count}** | Обновлена: {updated} | [перейти]({link})
ChatGptRequestFailed: ❌ Не удалось получить ответ от ChatGPT — попробуйте ответить на то же сообщение ещё раз
ChatGptImageTooBig: 📦 Изображение на {size} не влезает в лимит сервера — попросите вариант полегче
ChatGptEmptyPrompt: ❓ Пустой запрос — напишите текст или приложите файл
ChatGptGuildOnly: ❌ Команда работает только на сервере
ChatGptNotAuthorized: 🔐 ChatGPT ещё не подключён — администратор должен выполнить /chatgpt-auth login

# Кастомные действия (custom_ai_actions)
AiActionAvatarCard: 🖼️ Аватарка {user} — правлю её в новой сессии
AiActionAvatarFailed: ❌ Не удалось скачать аватарку {user}
MediaTooBig: 📦 Файл на {size} слишком большой — обработаю что-нибудь полегче
MediaResultTooBig: 📦 Результат получился на {size} и не влезает в лимит сервера — попроси покороче или поменьше
MediaNotReadable: ❌ Не смог прочитать этот файл как медиа
MediaFormatNotSupported: ❌ Формат «{format}» не поддерживается — умею gif, mp4, webm, png, jpg, webp
MediaPlanUnclear: ❓ Не понял, что именно сделать с файлом — скажи конкретнее: обрезать, кадрировать, уменьшить, сменить формат
MediaFailed: ❌ Не получилось обработать файл
MediaBusy: ⏳ Сейчас занят другим файлом — попробуй через пару минут
MediaShrinkFailed: 📦 Не смог ужать результат до {limit}, не превратив его в кашу — попроси кусок покороче
MediaGifTooHeavy: 🎞️ Гифка такой длины в лимит не влезет — попроси покороче или mp4
MediaPlanUnclearVideo: ❓ Не понял, что сделать с видео — скажи конкретнее: скачать, обрезать, вытащить звук, сделать гифку

# Скачивание видео с YouTube (custom_ai_actions/download_video)
YoutubeDownloading: ⬇️ Качаю в {quality} — это займёт какое-то время
YoutubeMeta: -# {container} · {resolution} · видео {video} · звук {audio}
YoutubeNoAudio: без звука
YoutubeQualityReduced: -# Качество снижено до {quality}: в {best} файл не влез бы в лимит сервера
YoutubeRecompressed: -# Пережал под лимит сервера ({limit}) — качество ниже оригинала
YoutubeTooBig: 📦 Даже в минимальном качестве это {size} — столько я не потяну
YoutubeTooLong: ⏱️ Видео идёт {duration}, а я берусь максимум за {limit} — попроси отрезок, например «обрежь с 10:00 по 12:00»
YoutubeLive: 📡 Это прямой эфир — приходи, когда он закончится
YoutubeAgeRestricted: 🔞 YouTube не отдаёт это видео без входа в аккаунт
YoutubeBotCheck: 🤖 YouTube требует подтвердить, что я не робот — нужны свежие куки
YoutubePrivate: 🔒 Это приватное видео
YoutubeGeoBlocked: 🌍 Видео заблокировано в стране, где живёт сервер
YoutubeUnavailable: ❌ YouTube говорит, что видео недоступно
YoutubeToolOutdated: 🔧 Не смог разобрать ответ YouTube — похоже, пора обновить yt-dlp
YoutubeNoRoom: 💾 Не хватает места на диске — попробуй позже
YoutubeFailed: ❌ Не получилось скачать это видео
