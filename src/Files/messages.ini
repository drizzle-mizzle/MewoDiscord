# Голосовые каналы — длительность сессии. Ходит парой за каждым сообщением журнала,
# а в молчащей сессии печатается сама. Отдельным сообщением, а не хвостом строки:
# так его видно в потоке событий и не приходится читать до конца каждой строки
VoiceSessionDuration: `Длительность разговора: {timer}`

# Голосовые каналы — подключение.
# Канала в тексте нет там, где журнал и так о нём: сообщения сессии живут в треде,
# названном по каналу. Исключение — вход, выход и конец разговора: их читают и списком
VoiceConversationStarted: 📳 Начался разговор
VoiceConversationEnded: 📴 Закончился разговор в {channel}
VoiceUserJoined: {user} присоединился к {channel}
VoiceUserLeft: {user} покинул {channel}
VoiceUserKicked: 🚪 {bot} исключил {user} из разговора

# Голосовые каналы — микрофон (self)
VoiceUserMuted: 🔇 {user} отключил себе микрофон
VoiceUserUnmuted: 🔊 {user} включил себе микрофон

# Голосовые каналы — микрофон (сервер)
VoiceUserServerMuted: 🔇 {user} был заглушен
VoiceUserServerUnmuted: 🔊 {user} был разглушен

# Голосовые каналы — звук (self)
VoiceUserDeafened: 🔇 {user} отключил себе звук
VoiceUserUndeafened: 🔊 {user} включил себе звук

# Голосовые каналы — звук (сервер)
VoiceUserServerDeafened: 🔇 {user} был полностью заглушен
VoiceUserServerUndeafened: 🔊 {user} был полностью разглушен

# Голосовые каналы — стрим
VoiceUserStartedStream: 📺 {user} начал стрим
VoiceUserStoppedStream: 📺 {user} завершил стрим

# Общие события — те же события для общего чата, где нет ни треда, ни контекста канала.
# Поэтому канал называется всегда, а таймер сессии не нужен: это приглашение зайти, а не журнал.
# Конца стрима здесь нет намеренно: звать посмотреть можно на то, что ещё идёт.
# К каждому дописывается ссылка на ту же строку в журнале — Discord разворачивает
# её сам; журнала нет — нет и ссылки, поэтому она отдельным шаблоном, а не в тексте
VoiceCommonWithLink: {text} | {link}
VoiceConversationStartedCommon: 📳 Начался разговор в {channel}
VoiceConversationEndedCommon: 📴 Закончился разговор в {channel}
VoiceUserStartedStreamCommon: 📺 {user} начал стрим в {channel}

# Голосовые каналы — проверка одиночества. Полчаса в канале одному — вопрос с кнопкой
# и пингом (единственное сообщение журнала, которое намеренно уведомляет),
# минута без ответа — отключение от канала
VoiceAloneCheck: {user} приём-приём?
VoiceAloneButton: 🏓Я ещё тут
VoiceAloneConfirmed: 🏓 {user} на месте
VoiceAloneNoAnswer: 🏓 Нет ответа от {user}
VoiceAloneNotYours: 🏓 Это не тебя спрашивали
VoiceAloneStale: 🏓 Вопрос уже неактуален

# Голосовые каналы — переименование «одинокого» канала
VoiceChannelRenamed: ✏️ Название канала изменено: **"{oldName}"** ➡️ **"{newName}"**

# Команда /reinstall
ReinstallDone: 🔄 Команды переустановлены на этом сервере. Удалено: глобальных **{global}**, серверных **{guild}**. Зарегистрировано: **{registered}**

# Команда /say
SayDone: ✅ Сообщение отправлено

# Команда /help. Два ключа: вторая половина живёт только при UseChatGpt: true —
# без него упоминания бота никто не слушает, и обещать их нельзя
HelpText: 👋 **Что я умею**
  🔗 Кинь в чат ссылку на пост **X** или **Telegram** — сам скачаю оттуда картинки и видео и пришлю в канал. Просить не надо, достаточно ссылки
HelpTextChatGpt: 📺 «@бот скачай <ссылка на YouTube>» — скачаю видео. Нужен кусок — так и скажи: «скачай отрезок с 1:00 по 1:30»
  🎬 Упомяни меня в сообщении с файлом (видео, гифка, картинка) и скажи, что сделать: обрезать, кадрировать, уменьшить, сменить формат, вытащить звук
  🎨 Упомяни меня с картинкой и попроси «дорисуй…» или «переделай…» — перерисую нейросетью
  🖼️ «@бот наряди @друга в пиратскую шляпу» — возьму его аватарку и поиздеваюсь над ней по твоей просьбе
  ✏️ Ответь реплаем на мой результат — доделаю его же: «ещё 5% справа», «а теперь сделай гифку»
  💬 `/chatgpt new` — новая сессия чата: отвечай реплаем на её сообщение, и я отвечу. `/chatgpt sessions` — список активных сессий

# Команда /purge
PurgeDone: 🗑️ Удалено сообщений: **{count}**
PurgeTooOld: ⚠️ Пропущено сообщений старше 14 дней: **{count}**
PurgeNoPermission: ❌ У меня нет прав на управление сообщениями в этом канале
PurgeScanned: 🔎 Просмотрено сообщений канала: **{count}**
PurgeScanStopped: ⚠️ Нашёл только **{found}** из **{requested}** — дальше либо начало канала, либо сообщения старше 14 дней, которые Discord массово удалять не даёт
PurgeScanLimit: ⚠️ Нашёл **{found}** из **{requested}**, просмотрев {scanned} последних сообщений канала — глубже не искал. Повтори команду, если нужно ещё
PurgeFailed: ❌ Discord не дал удалить эти сообщения — возможно, часть уже удалена или успела состариться
PurgePeriodClamped: ⚠️ Период обрезан до 14 дней — старше Discord массово не удаляет
PurgeNotTextChannel: ❌ Эта команда работает только в текстовых каналах
PurgeBadDateFormat: ❌ Неверный формат даты. Используй: yyyy-MM-dd HH:mm (например, 2026-03-21 18:00)

# Команда /set
SetTemperature: 🌡️ Температура ИИ установлена на **{value}**

# Медиа из Telegram
TelegramFooter: Telegram
TelegramTooBig: 📦 Файл на {size} не влезает в лимит Discord — [открыть в Telegram]({url})

# Медиа из X
XFooter: X
XTooBig: 📦 Файл на {size} не влезает в лимит Discord — [открыть в X]({url})

# Команда /chatgpt
# Многострочные значения: строка без Ключ: продолжает предыдущее сообщение
ChatGptLoginInstructions: 🔐 **Логин в ChatGPT**
  1️⃣ [Открой страницу входа]({url}) и войди в аккаунт с подпиской ChatGPT Plus
  2️⃣ После входа браузер попадёт на `localhost:1455` — страница не откроется, это нормально
  3️⃣ Скопируй ссылку из адресной строки целиком и нажми кнопку ниже
ChatGptLoginStartFailed: ❌ Не удалось начать логин — прокси недоступен или не задан ChatGptManagementKey (детали в логах)
ChatGptLoginDone: ✅ Логин выполнен — ChatGPT подключён
ChatGptLoginFailed: ❌ Логин не удался: {error}
ChatGptStatusEmpty: Подключённых аккаунтов ChatGPT нет — используй /chatgpt-auth login
ChatGptStatusHeader: 🔐 **Аккаунты ChatGPT** ({count})
ChatGptStatusUnavailable: ⚠️ недоступен

# Сессии ChatGPT
ChatGptSessionNew: 💬 **Новая сессия ChatGPT**
  Чтобы отправить запрос, ответь на это сообщение
ChatGptSessionsEmpty: Сессий пока нет — создай командой /chatgpt new
ChatGptSessionsTitle: Сессии ChatGPT
ChatGptSessionsLine: {index}. Канал: {channel} | Всего сообщений: **{count}** | Обновлена: {updated} | [перейти]({link})
ChatGptRequestFailed: ❌ Не удалось получить ответ от ChatGPT — ответь на то же сообщение ещё раз
ChatGptImageTooBig: 📦 Изображение на {size} не влезает в лимит сервера — попроси вариант полегче
ChatGptEmptyPrompt: ❓ Пустой запрос — напиши текст или приложи файл
ChatGptGuildOnly: ❌ Команда работает только на сервере
ChatGptNotAuthorized: 🔐 ChatGPT ещё не подключён — администратор должен выполнить /chatgpt-auth login

# Кастомные действия (custom_ai_actions)
AiActionAvatarCard: 🖼️ Аватарка {user} — правлю её в новой сессии
AiActionAvatarFailed: ❌ Не удалось скачать аватарку {user}
AiActionUserNotFound: ❓ Не нашёл этого человека на сервере — может, он уже ушёл?
MediaTooBig: 📦 Файл на {size} слишком большой — обработаю что-нибудь полегче
MediaResultTooBig: 📦 Результат получился на {size} и не влезает в лимит сервера — попроси покороче или поменьше
MediaNotReadable: ❌ Не смог прочитать этот файл как медиа
MediaFormatNotSupported: ❌ Формат «{format}» не поддерживается — умею gif, mp4, webm, png, jpg, webp
MediaFailed: ❌ Не получилось обработать файл
MediaBusy: ⏳ Сейчас занят: {what}. Большое видео качается и до получаса — попробуй позже
MediaPlanFailed: ❌ Не смог разобрать просьбу — похоже, ИИ сейчас недоступен. Попробуй ещё раз попозже
MediaTruncated: ✂️ Взял только первые {seconds} — столько за раз обрабатываю. Нужен другой кусок — скажи, с какой по какую секунду
MediaShrinkFailed: 📦 Не смог ужать результат до {limit}, не превратив его в кашу — попроси кусок покороче
MediaGifTooHeavy: 🎞️ Гифка такой длины в лимит не влезет — попроси покороче или mp4
MediaSourceGone: ❌ Не нашёл исходный файл — похоже, сообщение с ним удалили. Пришли файл заново
MediaModelNeedsStill: 🎞️ Такое умею только с картинками: видео и гифку покадрово не перерисовать. Механическую операцию назови конкретнее — обрезать, кадрировать, уменьшить, сменить формат

# Скачивание видео с YouTube (custom_ai_actions/download_video)
YoutubeDownloading: ⬇️ Качаю в {quality} — это займёт какое-то время
YoutubeCompressing: 🗜️ Скачал, теперь пережимаю под лимит сервера — это дольше качания
YoutubeMeta: -# {container} · {resolution} · видео {video} · звук {audio}
YoutubeNoAudio: без звука
YoutubeQualityReduced: -# Качество снижено до {quality}: в {best} файл не влез бы в лимит сервера
YoutubeRecompressed: -# Пережал под лимит сервера ({limit}) — качество ниже оригинала
YoutubeTooBig: 📦 Даже в минимальном качестве это {size} — столько я не потяну
YoutubeTooLong: ⏱️ Видео идёт {duration}, а я берусь максимум за {limit} — попроси отрезок, например «обрежь с 10:00 по 12:00»
YoutubeLive: 📡 Это прямой эфир — приходи, когда он закончится
YoutubeAgeRestricted: 🔞 YouTube не отдаёт это видео без входа в аккаунт
YoutubeBotCheck: 🤖 YouTube требует подтвердить, что я не робот — нужны свежие куки
YoutubePrivate: 🔒 Это приватное видео
YoutubeGeoBlocked: 🌍 Видео заблокировано в стране, где живёт сервер
YoutubeUnavailable: ❌ YouTube говорит, что видео недоступно
YoutubeToolOutdated: 🔧 Не смог разобрать ответ YouTube — похоже, пора обновить yt-dlp
YoutubeJsRuntime: 🔧 Не смог посчитать подпись YouTube — на сервере не хватает JavaScript-рантайма (deno)
YoutubeNoRoom: 💾 Не хватает места на диске — попробуй позже
YoutubeFailed: ❌ Не получилось скачать это видео
