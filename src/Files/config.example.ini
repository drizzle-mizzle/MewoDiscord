[COMMON]
BotToken: BOT_TOKEN
VoiceStatusChannel: 0
LogsChannel: 0

VerificationChannel: 0
VerificationRole: 0

# Часовой пояс для команд с локальным временем (IANA формат)
LocalTimeZone: Asia/Yekaterinburg

# Включает ChatGPT-часть (чат и генерация изображений через CLIProxyAPI). Применяется при запуске
UseChatGpt: false

# Адрес CLIProxyAPI: в Docker — http://cliproxy:8317, локально — http://localhost:8317
ChatGptProxyUrl: http://cliproxy:8317

# Ключ клиента для CLIProxyAPI (совпадает с одним из api-keys в cliproxy/config.yaml)
ChatGptProxyApiKey: CHATGPT_PROXY_API_KEY

# Пароль management API CLIProxyAPI для /chatgpt login (совпадает с MANAGEMENT_PASSWORD в cliproxy/management.env)
ChatGptManagementKey: CHATGPT_MANAGEMENT_KEY

# Пути к ffmpeg и ffprobe для операций над видео и гифками (обрезка, кроп, формат).
# По умолчанию берутся из PATH — в docker-образе они уже стоят
# FfmpegPath: ffmpeg
# FfprobePath: ffprobe

[MEDIA]
# Рабочий каталог yt-dlp и ffmpeg. В docker — том /media (см. docker-compose.yml).
# Не задан — временный каталог системы, то есть writable-слой контейнера:
# двухгигабайтное видео растит его молча, поэтому в docker том обязателен
WorkDirectory: /media

# Путь к yt-dlp. По умолчанию из PATH — в docker-образе он уже стоит
# YtDlpPath: yt-dlp

# Потолок на рабочий каталог, МБ: исходник плюс артефакты пережатия.
# Размер тома этим не ограничивается (обычному тому Docker размер не задать) —
# предел держит сам бот
BudgetMb: 3800

# Потолок на скачиваемый исходник, МБ
MaxSourceMb: 2048

# Максимальная длительность видео, минут: слот занят всю операцию,
# и многочасовой ролик занял бы бота целиком. Обрезки это не касается —
# отрезок качается отрезком
MaxDurationMinutes: 60

# Таймауты одной операции, минут
DownloadTimeoutMinutes: 30
EncodeTimeoutMinutes: 20

# Куки YouTube в формате Netscape — когда YouTube начинает требовать
# «подтвердите, что вы не робот». Заводить лучше на отдельном аккаунте,
# и монтировать файл на запись: yt-dlp обновляет его при выходе
# YoutubeCookiesFile: /app/state/youtube_cookies.txt

# Дополнительные аргументы yt-dlp. ОСТАВЬТЕ ПУСТЫМ, пока всё работает:
# набор клиентов плеера по умолчанию yt-dlp подбирает сам и правит с каждым релизом,
# а зафиксированный здесь список со временем начнёт мешать, а не помогать.
# Заполнять только когда бот пожаловался на антибот-проверку, и только значением,
# которое проверено на этом же сервере:
#   docker compose exec mewo-bot yt-dlp --ignore-config \
#     --extractor-args youtube:player_client=КЛИЕНТЫ -F https://youtu.be/dQw4w9WgXcQ
# Список форматов в ответ — значение рабочее; ошибка — значит нет.
# Разделитель — любой пробельный символ. Кавычки НЕ нужны: аргументы уходят
# списком, а не строкой в оболочку, и кавычка стала бы частью значения
# YtDlpExtraArgs:

[CHATGPT_SETTINGS]
# Модель чата (роутер Codex; список — GET /v1/models у прокси)
ChatModel: gpt-5.5
MaxTokens: 2048

# Глубина рассуждений модели в обычном чате: minimal, low, medium, high.
# Значение вне этого списка означает «не передавать уровень вовсе» — так его
# и выключают. Служебные запросы кастомных действий уровень не получают:
# там ответ «ДА» или «НЕТ», думать над ним нечего
ReasoningEffort: high

# Дешёвая модель для служебных запросов кастомных действий: распознать попадание
# («ДА»/«НЕТ») и формализовать запрос. Имя — из списка GET /v1/models у прокси.
# Не задана — берётся ChatModel: работает так же, просто дороже и медленнее
# InstantModel:

# Добавка к базовому системному промпту: характер, язык и прочие пожелания.
# Формат чата и имя бота модели объясняет базовый промпт в коде — здесь только сверх него
SystemPrompt: Отвечай на русском, если не попросили иначе.
